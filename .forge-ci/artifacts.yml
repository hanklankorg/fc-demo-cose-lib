# Artifacts Configuration for cose-lib
# Maven library published to Maven Central

# Release files, the Maven Central packages and the release commit and tag
# are signed with the GPG key in RELEASE_GPG_PRIVATE_KEY, as before.
sign:
  method: gpg
git-signing:
  method: gpg

artifacts:
  - name: cose-lib
    project-type: maven
    working-directory: .
    build-type: library
    publish-to:
      - maven-central
    config:
      java-version: 21
      settings-path: .mvn/settings.xml
